name: Preview build check

on:
  push:
    branches:
      - maquette-paris-20260918
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        continue-on-error: true
        run: npm run typecheck

      - name: Production SSG build
        run: npm run build:ssg
